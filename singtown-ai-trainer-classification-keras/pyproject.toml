[project]
name = "singtown-ai-trainer-classification-keras"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "keras>=3.12.0",
    "singtown-ai>=1.10.1",
    "tensorflow==2.20.0",
    # The CUDA libraries TensorFlow needs to train on a GPU. Linux x86_64 only:
    # the image still runs on a machine without a GPU, and other platforms
    # (macOS for development, arm64) stay on the CPU.
    "tensorflow[and-cuda]==2.20.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.workspace]
members = [
    "singtown-ai-trainer-classification-keras",
]
